<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match Recall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Gothic+A1:wght@400;500;700&display=swap">
<style>
/* Layout: a broadcast pick-and-ban screen. Blue side left, red side right; the guess board is the scoreboard between them. */
:root {
  --rift: #0e1623;      /* ground */
  --deck: #152033;      /* raised strip */
  --rule: #24324a;      /* hairlines */
  --chalk: #e8edf4;     /* text */
  --haze: #8796ac;      /* secondary text */
  --blue-side: #4f8dff;
  --red-side: #ff5c63;
  --hit: #2f9e60; --near: #c9961f; --miss: #34415a; --on-state: #ffffff;
  --display: "Saira Condensed", "Arial Narrow", "Gothic A1", sans-serif;
  --body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--rift); color: var(--chalk); font: 15px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
html:lang(ko) body { word-break: keep-all; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; line-height: 1.02; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 2px solid var(--blue-side); outline-offset: 2px; }
.muted { color: var(--haze); }
.small { font-size: 0.85rem; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* Top bar */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--rule); }
.brand { background: none; border: 0; padding: 0; font: 700 1.25rem var(--display); letter-spacing: 0.06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.brand::before { content: ""; width: 18px; height: 12px; background: linear-gradient(90deg, var(--blue-side) 0 50%, var(--red-side) 50% 100%); }
.lang { display: flex; gap: 14px; }
.lang button { background: none; border: 0; padding: 2px 0; font-size: 0.9rem; color: var(--haze); border-bottom: 2px solid transparent; }
.lang button[aria-pressed="true"] { color: var(--chalk); border-bottom-color: var(--chalk); }

/* Home */
#stage { display: grid; gap: 28px; min-width: 0; }
.hero { display: grid; gap: 14px; max-width: 46rem; padding-top: 20px; }
.hero h1 { font-size: clamp(2.6rem, 8vw, 4.6rem); letter-spacing: 0.005em; }
.hero h1 .b { color: var(--blue-side); } .hero h1 .r { color: var(--red-side); }
.hero p { font-size: 1.05rem; color: var(--haze); max-width: 38rem; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; font: 600 1.05rem var(--display); letter-spacing: 0.03em; }
.facts b { font-size: 1.4rem; margin-right: 4px; }
.modes-block { display: grid; gap: 6px; }
.modes-block h2 { font: 500 0.95rem var(--body); color: var(--haze); }
.modes { display: grid; border-top: 1px solid var(--rule); }
.mode { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 16px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 14px 10px; }
.mode:hover:not(:disabled) { background: var(--deck); }
.mode:disabled { cursor: default; opacity: 0.45; }
.mode .mname { font: 700 1.9rem/1 var(--display); letter-spacing: 0.01em; }
.mode .sub { color: var(--haze); font-size: 0.9rem; grid-column: 1; }
.mode .count { grid-row: 1 / span 2; grid-column: 2; font: 600 1.05rem var(--display); color: var(--haze); text-align: right; }
.mode .count b { display: block; font-size: 1.9rem; line-height: 1; color: var(--chalk); }
.resume { justify-self: start; }

/* Buttons */
.btn { font: 700 1.05rem var(--display); letter-spacing: 0.06em; text-transform: uppercase; padding: 9px 18px; border-radius: 2px; border: 1.5px solid var(--chalk); background: var(--chalk); color: var(--rift); }
.btn.ghost { background: transparent; color: var(--chalk); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--haze); }
.btn:disabled { opacity: 0.4; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { font-size: 0.88rem; color: var(--haze); }
.status.ok { color: var(--hit); }

/* Play: header strip */
.strip { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; padding-top: 18px; }
.strip .mode-name { font: 600 1rem var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--haze); }
.strip h2 { font-size: clamp(2rem, 5vw, 2.8rem); }
.pips { display: flex; gap: 5px; align-items: center; }
.pip { width: 22px; height: 8px; background: var(--rule); transform: skewX(-20deg); }
.pip.cur { background: var(--chalk); }
.pip.hit { background: var(--hit); } .pip.near { background: var(--near); } .pip.miss { background: #5a6780; }
.counter { display: flex; gap: 22px; font: 600 1rem var(--display); color: var(--haze); letter-spacing: 0.04em; }
.counter b { color: var(--chalk); font-size: 1.5rem; margin-right: 3px; }

.game { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.board, .clues { display: grid; gap: 16px; min-width: 0; }
.hit { background: var(--hit); } .near { background: var(--near); } .miss { background: var(--miss); }

/* Picker */
.picker { display: grid; gap: 8px; min-width: 0; background: var(--deck); padding: 12px; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); }
.tabs:empty { display: none; }
.tabs button { flex: 1 1 0; background: none; border: 0; border-bottom: 3px solid transparent; padding: 6px 8px 8px; font: 700 1.1rem var(--display); letter-spacing: 0.04em; color: var(--haze); }
.tabs button[aria-pressed="true"] { color: var(--chalk); border-bottom-color: var(--chalk); }
.tabs button:disabled { opacity: 0.35; cursor: default; }
.tabs .n { font-weight: 500; font-size: 0.9rem; margin-left: 5px; }
.picker input { font: inherit; width: 100%; padding: 9px 10px; border-radius: 2px; border: 1px solid var(--rule); background: var(--rift); color: var(--chalk); }
.picker input::placeholder { color: var(--haze); }
.series-list { max-height: 280px; overflow-y: auto; background: var(--rift); border: 1px solid var(--rule); }
.series-year { position: sticky; top: 0; background: var(--rift); padding: 6px 10px 2px; font: 700 0.95rem var(--display); letter-spacing: 0.05em; color: var(--haze); border-bottom: 1px solid var(--rule); }
.series-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; font-size: 0.92rem; }
.series-row span:first-child { color: var(--haze); font-size: 0.82rem; padding-top: 1px; }
.series-row:hover { background: var(--deck); }
.series-row[aria-pressed="true"] { background: var(--blue-side); color: #fff; }
.series-row[aria-pressed="true"] span:first-child { color: inherit; }
.series-empty { padding: 12px 10px; color: var(--haze); font-size: 0.9rem; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field span { font: 600 0.9rem var(--display); letter-spacing: 0.05em; color: var(--haze); }
.picker select { font: inherit; width: 100%; min-width: 0; padding: 9px 8px; border-radius: 2px; border: 1px solid var(--rule); background: var(--rift); color: var(--chalk); }
.picker-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

/* Guess board */
.grid-wrap { overflow-x: auto; }
table.guesses { border-collapse: separate; border-spacing: 3px; width: 100%; }
table.guesses th { font: 600 0.95rem var(--display); letter-spacing: 0.05em; color: var(--haze); text-align: left; padding: 0 6px 2px; }
table.guesses td { border-radius: 2px; padding: 7px 8px; color: var(--on-state); font-weight: 700; font-size: 0.86rem; line-height: 1.25; vertical-align: middle; }
table.guesses td small { font-weight: 400; opacity: 0.85; }
table.guesses td.label { color: var(--haze); background: transparent; border: 1px dashed var(--rule); font-weight: 400; padding: 14px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--haze); align-items: center; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 1px; vertical-align: -1px; margin-right: 5px; }

/* Clues */
.clue { display: grid; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); min-width: 0; }
.clue-head { display: flex; align-items: baseline; gap: 10px; }
.clue-head .k { font: 700 1.05rem var(--display); color: var(--haze); width: 1.2em; }
.clue-head h3 { font-size: 1.35rem; letter-spacing: 0.01em; }
.clue.locked { padding-bottom: 10px; }
.clue.locked .clue-head h3 { font-size: 1.05rem; color: var(--haze); font-weight: 600; }
.clue.locked .when { margin-left: auto; font-size: 0.8rem; color: var(--haze); }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.side { min-width: 0; border-top: 3px solid var(--blue-side); padding-top: 6px; }
.side.red { border-top-color: var(--red-side); }
.side-label { font: 700 0.95rem var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
.side.blue .side-label { color: var(--blue-side); }
.side.red .side-label { color: var(--red-side); }
.side ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; font-size: 0.92rem; }
.side li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--rule); }
.side li:last-child { border-bottom: 0; }
.side li > span:first-child { color: var(--haze); font-size: 0.8rem; }
.side li.ban { justify-content: flex-start; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--haze) 70%, transparent); }
.series-note { color: var(--haze); font-size: 0.85rem; }
.series { display: grid; gap: 4px; }
.series ul { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 4px; font-size: 0.92rem; }
.series li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; }
.series li > span:first-child { color: var(--haze); font-size: 0.8rem; padding-top: 2px; }
.builds { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.build { display: grid; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.build:last-child { border-bottom: 0; }
.build-champ { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 0.9rem; }
.items { display: flex; flex-wrap: wrap; gap: 3px; }
.item { display: inline-flex; align-items: center; gap: 5px; font-size: 0.76rem; background: var(--deck); padding: 2px 7px 2px 2px; border-radius: 1px; }
.ci { width: 24px; height: 24px; flex: none; border-radius: 2px; display: block; }
.ii { width: 20px; height: 20px; flex: none; display: block; }
.cn { display: inline-flex; align-items: center; gap: 7px; }
.cns { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.ban .ci { filter: grayscale(1); opacity: 0.6; }
.build-champ .ci { width: 28px; height: 28px; }
.ace .ci { width: 36px; height: 36px; }
.ace { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-items: baseline; }
.ace .player { font: 700 2.2rem/1 var(--display); grid-row: span 2; }
.ace .kda { font: 600 1.15rem var(--display); font-variant-numeric: tabular-nums; }
.trivia { font-size: 1rem; max-width: 36rem; }

/* Answer reveal */
.result { display: grid; gap: 8px; background: var(--deck); padding: 16px; border-left: 4px solid var(--hit); }
.result.gave-up { border-left-color: #5a6780; }
.result .verdict { font: 700 1rem var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--hit); }
.result.gave-up .verdict { color: var(--haze); }
.result h3 { font-size: 1.7rem; }

/* Results */
.final { display: grid; gap: 22px; max-width: 680px; padding-top: 18px; }
.final .mode-name { font: 600 1rem var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--haze); }
.total { font: 700 clamp(4.5rem, 16vw, 7rem)/0.9 var(--display); font-variant-numeric: tabular-nums; }
.total span { font-size: 0.32em; color: var(--haze); font-weight: 600; margin-left: 6px; }
.qlist { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--rule); }
.qlist li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--rule); }
.qdot { width: 26px; height: 26px; border-radius: 2px; color: var(--on-state); display: grid; place-items: center; font: 700 1rem var(--display); }
.qlist .qres { font: 600 1.05rem var(--display); color: var(--haze); white-space: nowrap; }
.share { white-space: pre; background: var(--deck); padding: 12px; font-size: 0.92rem; overflow-x: auto; }
footer { font-size: 0.75rem; color: var(--haze); border-top: 1px solid var(--rule); padding-top: 14px; max-width: 46rem; }

@media (max-width: 880px) { .game { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .builds { grid-template-columns: 1fr; } .mode .mname { font-size: 1.6rem; } }
@media (prefers-reduced-motion: no-preference) {
  .fresh { animation: pop 0.28s ease-out; }
  @keyframes pop { from { transform: translateY(4px); opacity: 0.2; } to { transform: none; opacity: 1; } }
}
</style>
</head>

</div>

  const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (saved && typeof saved === "object") state = { ...state, ...saved };
  if (state.run && (!MODE[state.run.mode] || state.run.ids.some((i) => !META[i]) || state.run.answers.some((a) => a.grid.some((g) => typeof g !== "object")))) state = { ...state, screen: "home", run: null };
} catch {}
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {} };
let fresh = null;

// Five puzzles from the mode, games you haven't seen yet first.
function startRun(modeId) {
  const mode = MODE[modeId];
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let seen = new Set(state.seen[modeId] || []);
  let unseen = mode.pool.filter((i) => !seen.has(GAMES[i].id));
  if (unseen.length < RUN_LENGTH) { seen = new Set(); unseen = [...mode.pool]; }
  const ids = shuffle(unseen).slice(0, RUN_LENGTH);
  state.seen[modeId] = [...seen, ...ids.map((i) => GAMES[i].id)];
  state.run = { mode: modeId, ids, q: 0, answers: ids.map(() => ({ grid: [], done: false, gaveUp: false })) };
  state.screen = "play";
  resetPicker();
  save(); render(); window.scrollTo({ top: 0 });
}

// ---- Scoring ------------------------------------------------------------
const arrow = (target, guess) => (target > guess ? "↑" : target < guess ? "↓" : "");
function teamCell(guessId, targetId, otherId, mode) {
  const g = TEAM[guessId], tg = TEAM[targetId];
  const near = guessId === otherId || (mode.multiRegion && g.region === tg.region);
  return { text: g.name, sub: mode.multiRegion ? t().regions[g.region] : "", cls: guessId === targetId ? "hit" : near ? "near" : "miss" };
}
const yearCell = (guess, target) => { const d = Math.abs(guess - target); return { text: `${guess} ${arrow(target, guess)}`.trim(), cls: d === 0 ? "hit" : d === 1 ? "near" : "miss" }; };
const eventCell = (guess, target) => ({ text: t().events[guess], cls: guess === target ? "hit" : groupOf(guess) === "LCK" && groupOf(target) === "LCK" ? "near" : "miss" });
const COLS = (mode) => [
  { key: "winner", cell: (b, m) => teamCell(b.w, m.winner, m.loser, mode) },
  { key: "loser", cell: (b, m) => teamCell(b.l, m.loser, m.winner, mode) },
  ...(mode.askEvent ? [{ key: "event", cell: (b, m) => eventCell(b.event, m.event) }] : []),
  { key: "year", cell: (b, m) => yearCell(b.year, m.year) },
];
// A guess is { w, l, year, event, ok }. Right when every field the form asks for matches.
const isRight = (g, m, mode) => g.w === m.winner && g.l === m.loser && g.year === m.year && (!mode.askEvent || g.event === m.event);
const HINTS = ["draft", "bans", "series", "items", "loserAce", "winnerAce", "trivia"];
const wrongCount = (a) => a.grid.filter((g) => !g.ok).length;
const cluesEarned = (a, m) => Math.min(HINTS.length, 1 + wrongCount(a, m));
const hintsOpen = (a, m) => (a.done ? HINTS.length : cluesEarned(a, m));
const solved = (a) => a.done && !a.gaveUp;
const pointsFor = (a) => (solved(a) ? MAX_GUESSES + 1 - a.grid.length : 0);
const dotClass = (a) => (!a.done ? "" : !solved(a) ? "miss" : a.grid.length <= 3 ? "hit" : "near");

const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderHome() {
  const card = (mode) => `<button class="mode" data-mode="${mode.id}" ${mode.soon ? "disabled" : ""}>
    <span class="mname">${esc(mode.name[lang])}</span><span class="sub">${esc(mode.sub[lang])}</span>
    <span class="count">${mode.soon ? t().soon : t().puzzles(mode.pool.length)}</span></button>`;
  const run = state.run;
  const resume = run && state.screen === "home" ? `<div class="actions resume"><button class="btn" id="resume-btn">${t().resume(MODE[run.mode].name[lang], Math.min(run.q + 1, run.ids.length), run.ids.length)}</button></div>` : "";
  const f = t().facts;
  return `<section class="hero"><h1>${t().headline}</h1><p>${t().intro}</p>
    <p class="facts"><span><b>${RUN_LENGTH}</b>${f[0]}</span><span><b>${MAX_GUESSES}</b>${f[1]}</span><span><b>${HINTS.length}</b>${f[2]}</span></p>${resume}</section>
    <section class="modes-block" aria-label="${t().pickMode}"><h2>${t().leagues}</h2><div class="modes">${MODES.filter((m) => m.kind === "league").map(card).join("")}</div></section>
    <section class="modes-block"><h2>${t().teams}</h2><div class="modes">${MODES.filter((m) => m.kind === "team").map(card).join("")}</div></section>`;
}

const sideList = (title, cls, rows) => `<div class="side ${cls}"><span class="side-label">${title}</span><ul>${rows.join("")}</ul></div>`;
function hintBody(key, g) {
  const h = g.hints, T = t();
  switch (key) {
    case "draft":
      return `<div class="sides">${["blue", "red"].map((s) => sideList(T[s], s, h.draft[s].map((c, i) => `<li><span>${T.roles[i]}</span>${champTag(c)}</li>`))).join("")}</div>`;
    case "bans":
      return `<div class="sides">${["blue", "red"].map((s) => sideList(T[s], s, (h.bans[s].length ? h.bans[s] : ["None"]).map((c) => `<li class="ban">${champTag(c)}</li>`))).join("")}</div>`;
    case "series": {
      const sr = h.series;
      const tiers = (list) => list.map(([n, cs]) => [n, cs.filter((c) => c && c !== "None")]).filter(([, cs]) => cs.length).map(([n, cs]) => `<li><span>${n === sr.games ? T.everyGame : T.nOf(n, sr.games)}</span><span class="cns">${cs.map(champTag).join("")}</span></li>`).join("") || "<li><span>—</span></li>";
      return `<p class="series-note">${T.across(sr.games)}</p><div class="series"><span class="side-label">${T.mostPicked}</span><ul>${tiers(sr.picks)}</ul><span class="side-label">${T.mostBanned}</span><ul>${tiers(sr.bans)}</ul></div>`;
    }
    case "items":
      return `<div class="builds">${["blue", "red"].map((s) => `<div class="side ${s}"><span class="side-label">${T[s]}</span>
        ${h.items[s].map(([c, items], i) => `<div class="build"><span class="build-champ">${champIcon(c)}<span>${esc(champ(c))}</span> <span class="muted small">${T.roles[i]}</span></span>
        <div class="items">${items.map((it) => `<span class="item">${itemIcon(it)}${esc(itemName(it))}</span>`).join("")}</div></div>`).join("")}</div>`).join("")}</div>`;
    case "loserAce":
    case "winnerAce": {
      const a = h[key];
      return `<div class="ace"><span class="player">${esc(a.player)}</span><span class="cn">${champIcon(a.champ)}<span>${esc(champ(a.champ))}</span> <span class="muted small">${T.roles[["Top", "Jungle", "Mid", "Bot", "Support"].indexOf(a.role)] || a.role}</span></span><span class="kda">${a.kda}</span></div>`;
    }
    default:
      return `<p class="trivia">${esc(g.trivia[lang])}</p>`;
  }
}
function renderHints(g, a, m) {
  const open = hintsOpen(a, m), T = t();
  return `<aside class="clues" aria-label="Clues">${HINTS.map((k, i) => i < open
    ? `<div class="clue${i === open - 1 && fresh !== null ? " fresh" : ""}"><div class="clue-head"><span class="k">${T.clue(i + 1)}</span><h3>${T.hint[k]}</h3></div>${hintBody(k, g)}</div>`
    : `<div class="clue locked"><div class="clue-head"><span class="k">${T.clue(i + 1)}</span><h3>${T.hint[k]}</h3><span class="when">${T.unlocks(i)}</span></div></div>`).join("")}</aside>`;
}

const picker = { w: "", l: "", year: "", event: "" };
const resetPicker = () => Object.assign(picker, { w: "", l: "", year: "", event: "" });
const REGION_ORDER = ["LCK", "LPL", "LEC", "LCS", "PCS", "VCS"];
// Show a former name where people may know the team by it: "T1 (SK Telecom T1)".
const teamLabel = (id) => { const x = TEAM[id], old = x.aka[0]; return old && old.length > 3 && !x.name.includes(old) ? `${x.name} (${old})` : x.name; };
const opt = (v, label, cur) => `<option value="${esc(v)}"${String(cur) === String(v) ? " selected" : ""}>${esc(label)}</option>`;
function teamOptions(mode, cur) {
  const o = (ids) => ids.map((id) => opt(id, teamLabel(id), cur)).join("");
  if (!mode.multiRegion) return o(mode.teams);
  return REGION_ORDER.map((r) => [r, mode.teams.filter((id) => TEAM[id].region === r)]).filter(([, ids]) => ids.length)
    .map(([r, ids]) => `<optgroup label="${esc(t().regions[r])}">${o(ids)}</optgroup>`).join("");
}
const pickedGuess = (mode, m) => ({ w: picker.w, l: picker.l, year: Number(picker.year), event: mode.askEvent ? picker.event : m.event });
function pickProblem(mode, a, m) {
  if (!picker.w || !picker.l || !picker.year || (mode.askEvent && !picker.event)) return "incomplete";
  if (picker.w === picker.l) return t().sameTeam;
  const g = pickedGuess(mode, m);
  if (a.grid.some((x) => x.w === g.w && x.l === g.l && x.year === g.year && x.event === g.event)) return t().tried;
  return "";
}
function renderPicker() {
  const btn = $("#guess-btn");
  if (!btn) return;
  const run = state.run, mode = MODE[run.mode], a = run.answers[run.q], m = META[run.ids[run.q]];
  const problem = pickProblem(mode, a, m);
  btn.disabled = problem !== "";
  $("#pick-note").textContent = problem === "incomplete" ? "" : problem;
}

function renderPlay() {
  const run = state.run, mode = MODE[run.mode], i = run.ids[run.q], g = GAMES[i], a = run.answers[run.q], m = META[i], T = t();
  const cols = COLS(mode);
  const pips = run.answers.map((x, k) => `<span class="pip ${k === run.q && !x.done ? "cur" : dotClass(x)}"></span>`).join("");
  const head = `<div class="strip"><div><p class="mode-name">${esc(mode.name[lang])}</p><h2>${T.question(run.q + 1, run.ids.length)}</h2></div>
    <div class="counter"><span><b>${a.grid.length}</b>/ ${MAX_GUESSES} ${T.guesses}</span><span><b>${hintsOpen(a, m)}</b>/ ${HINTS.length} ${T.clues}</span><span class="pips" aria-label="${run.q + 1} / ${run.ids.length}">${pips}</span></div></div>`;
  const legend = `<p class="legend"><span><span class="sw hit"></span>${T.legendRight}</span><span><span class="sw near"></span>${mode.multiRegion ? T.legendNearRegion : T.legendNearSwap}</span><span><span class="sw miss"></span>${T.legendWrong}</span><span>${T.legendArrows}</span></p>`;
  const rows = a.grid.map((guessed, gi) => `<tr>${cols.map((c) => { const x = c.cell(guessed, m); return `<td class="${x.cls}${fresh === gi ? " fresh" : ""}">${esc(x.text)}${x.sub ? `<br><small>${esc(x.sub)}</small>` : ""}</td>`; }).join("")}</tr>`).join("");
  const field = (key, label, options) => `<label class="field"><span>${label}</span><select data-field="${key}"><option value="">${T.choose}</option>${options}</select></label>`;
  const form = a.done ? "" : `<form class="picker"><div class="fields">
    ${field("w", T.winner, teamOptions(mode, picker.w))}${field("l", T.loser, teamOptions(mode, picker.l))}
    ${mode.askEvent ? field("event", T.event, mode.events.map((e) => opt(e, T.events[e], picker.event)).join("")) : ""}
    ${field("year", T.year, mode.years.map((y) => opt(y, y, picker.year)).join(""))}</div>
    <div class="picker-foot"><span class="small muted" id="pick-note"></span><button class="btn" type="submit" id="guess-btn" disabled>${T.guess}</button></div></form>`;
  const last = run.q === run.ids.length - 1;
  const result = !a.done ? "" : `<div class="result${solved(a) ? "" : " gave-up"}">
    <p class="verdict">${solved(a) ? T.solvedIn(a.grid.length) : a.grid.length >= MAX_GUESSES ? T.outOf : T.theAnswer}</p>
    <h3>${esc(T.answerLabel(m))}</h3><p>${esc(T.beat(m.winnerName, m.loserName))}</p>
    <div class="actions"><button class="btn" id="next-btn">${last ? T.seeResults : T.next}</button></div></div>`;
  const giveUp = a.done ? "" : `<div class="actions"><button class="btn ghost" id="give-up">${T.giveUp}</button></div>`;
  return `${head}<div class="game"><section class="board" aria-label="Your guesses">${result}${form}
    <div class="grid-wrap"><table class="guesses"><thead><tr>${cols.map((c) => `<th>${T[c.key]}</th>`).join("")}</tr></thead>
    <tbody>${rows || `<tr><td class="label" colspan="${cols.length}">${T.empty}</td></tr>`}</tbody></table></div>${legend}${giveUp}</section>
    ${renderHints(g, a, m)}</div>`;
}

function shareText() {
  const run = state.run, mode = MODE[run.mode];
  const total = run.answers.reduce((s, a) => s + pointsFor(a), 0);
  const sq = { hit: "🟩", near: "🟨", miss: "⬛" };
  return `Match Recall · ${mode.name[lang]} · ${total}/${RUN_LENGTH * MAX_GUESSES}\n${run.answers.map((a) => sq[dotClass(a)]).join("")}\n${run.answers.map((a) => (solved(a) ? a.grid.length : "X")).join(" · ")}`;
}

function renderResults() {
  const run = state.run, mode = MODE[run.mode], T = t();
  const total = run.answers.reduce((s, a) => s + pointsFor(a), 0);
  return `<section class="final"><div><p class="mode-name">${esc(mode.name[lang])} · ${T.roundOver}</p>
    <p class="total">${total}<span> / ${RUN_LENGTH * MAX_GUESSES} ${T.points}</span></p></div>
    <ol class="qlist">${run.answers.map((a, k) => { const m = META[run.ids[k]]; return `<li><span class="qdot ${dotClass(a)}">${k + 1}</span>
      <span><strong>${esc(T.answerLabel(m))}</strong><br><span class="small muted">${esc(T.beat(m.winnerName, m.loserName))}</span></span>
      <span class="qres">${T.resultLine(a.grid.length, solved(a))}</span></li>`; }).join("")}</ol>
    <div class="share" id="share-text">${esc(shareText())}</div>
    <div class="actions"><button class="btn" data-mode="${mode.id}">${T.again}</button><button class="btn ghost" id="to-home">${T.other}</button>
    <button class="btn ghost" id="copy-share">${T.copy}</button><span class="status" id="share-status"></span></div></section>`;
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("#footer").textContent = t().footer;
  const screen = state.run ? state.screen : "home";
  $("#stage").innerHTML = screen === "play" ? renderPlay() : screen === "results" ? renderResults() : renderHome();
  if (screen === "play") renderPicker();
}

// ---- Events -------------------------------------------------------------
function guess() {
  const run = state.run, mode = MODE[run.mode], a = run.answers[run.q], m = META[run.ids[run.q]];
  if (pickProblem(mode, a, m)) return;
  const g = pickedGuess(mode, m);
  g.ok = isRight(g, m, mode);
  a.grid.push(g);
  fresh = a.grid.length - 1;
  if (g.ok) a.done = true;
  else if (a.grid.length >= MAX_GUESSES) { a.done = true; a.gaveUp = true; }
  save(); render(); fresh = null;
}
document.addEventListener("submit", (e) => { e.preventDefault(); guess(); });
document.addEventListener("click", (e) => {
  const langBtn = e.target.closest("[data-lang]");
  if (langBtn) { lang = langBtn.dataset.lang; try { localStorage.setItem("match-recall:lang", lang); } catch {} render(); return; }
  const modeBtn = e.target.closest("[data-mode]");
  if (modeBtn) { startRun(modeBtn.dataset.mode); return; }
  const id = e.target.closest("button")?.id;
  if (id === "home-btn" || id === "to-home") { if (id === "to-home" || state.screen === "results") state.run = null; state.screen = "home"; save(); render(); return; }
  if (id === "resume-btn") { state.screen = state.run.answers.every((x) => x.done) && state.run.q === state.run.ids.length - 1 ? "results" : "play"; save(); render(); return; }
  if (id === "give-up") { const a = state.run.answers[state.run.q]; a.done = true; a.gaveUp = true; save(); render(); return; }
  if (id === "next-btn") {
    const run = state.run;
    if (run.q < run.ids.length - 1) { run.q++; resetPicker(); }
    else state.screen = "results";
    save(); render(); window.scrollTo({ top: 0 }); return;
  }
  if (id === "copy-share") copy($("#share-text").textContent, $("#share-status"));
});
async function copy(text, el) {
  try { await navigator.clipboard.writeText(text); el.textContent = t().copied; el.className = "status ok"; }
  catch { el.textContent = t().copyFail; el.className = "status"; }
}
document.addEventListener("change", (e) => { const f = e.target.dataset?.field; if (f) { picker[f] = e.target.value; renderPicker(); } });

render();
</script>
</body>
</html>
